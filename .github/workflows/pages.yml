name: Publicar apresentação no GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Verificar JavaScript e arquivos principais
        run: |
          node --check site/dist/app.js
          test -s site/dist/index.html
          test -s site/dist/styles.css
          test -s site/dist/assets/implantacao.png
          test -s site/dist/docs/leticia-oliveira-tcc.pdf
      - name: Preparar apresentação
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
