name: Publicar apresentação no GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/dist/**'
      - 'site/build_pages.py'
      - 'site/test_build_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Verificar JavaScript e arquivos principais
        run: |
          node --check site/dist/app.js
          node --check site/dist/project-viewer.js
          node --check site/dist/territory-content.js
          node --check site/dist/board-viewer.js
          test -s site/dist/index.html
          test -s site/dist/atlas.css
          test -s site/dist/project.css
          test -s site/dist/assets/project-2026/historico-abertura.webp
          test -s site/dist/assets/project-2026/intervencao-aproximacao.webp
          test -s site/dist/assets/project-2026/prancha-10.webp
          test -s site/dist/assets/implantacao.png
          test -s site/dist/docs/leticia-oliveira-tcc.pdf
          test -s site/dist/docs/projeto-2026.pdf
          test -s site/dist/docs/fotomontagens-2026.pdf
      - name: Preparar domínio e caminho do TCC
        run: |
          python3 -m unittest discover -s site -p 'test_build_pages.py'
          python3 site/build_pages.py
          test -s site/_site/tcc/index.html
          test -s site/_site/sitemap.xml
          test -s site/_site/robots.txt
      - name: Preparar apresentação
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/_site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
